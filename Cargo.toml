[workspace]
members = ["crates/boite-agent-api", "crates/boite-core", "crates/boite-identity", "crates/boite-mcp", "crates/boite-pilot", "crates/boite-server", "src-tauri"]
exclude = ["vendor/portable-pty"]
resolver = "2"

# portable-pty 0.9.0 with one change, in `src/win/psuedocon.rs`: the
# pseudoconsole is created without PSEUDOCONSOLE_INHERIT_CURSOR. The upstream
# flag makes every Windows PTY wait on the terminal before its child runs, and
# a console closed during that wait never exits. Drop this patch only for an
# upstream release that lets the caller choose the flags.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
# Fat LTO + a single codegen unit costs link time but is worth it here: the PTY
# read loop and the OSC parser are the hot path of the whole app, and both live
# behind a crate boundary that thin LTO will not inline across.
lto = "fat"
codegen-units = 1
strip = true

# `panic = "abort"` is deliberately NOT set: a panic in one PTY reader thread
# must not take every other session down with it.
